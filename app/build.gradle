plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.d4tech.d4ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.d4tech.d4ai"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.2.0"
        // Paste your free key from https://console.picovoice.ai if you enable Porcupine later
        buildConfigField "String", "PICOVOICE_ACCESS_KEY", "\"\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Optional: uncomment after adding Picovoice access key
    // implementation 'ai.picovoice:porcupine-android:3.0.2'
    // implementation 'ai.picovoice:eagle-android:1.0.0'
}
